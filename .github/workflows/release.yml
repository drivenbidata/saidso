name: Release

# Installers are built per-platform because PyInstaller freezes for the machine
# it runs on; there is no cross-compiling this.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# attestations/id-token let GitHub sign a provenance statement for each
# installer: proof that this exact binary came out of this workflow, from this
# commit. It is not code signing - the OS still warns - but it is verifiable by
# anyone with `gh attestation verify`, and it costs nothing.
permissions:
  contents: write
  attestations: write
  id-token: write

jobs:
  installers:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install the engine and its build tooling
        run: |
          pip install -e ".[all]"
          pip install pyinstaller

      - name: Freeze the engine
        run: >
          python -m PyInstaller packaging/saidso-engine.spec --noconfirm
          --distpath dist/engine --workpath build/pyinstaller

      - name: Check the frozen engine actually starts
        shell: bash
        run: |
          python - <<'PY'
          import json, subprocess, sys, glob
          exe = glob.glob("dist/engine/saidso-engine/saidso-engine*")[0]
          p = subprocess.Popen([exe, "--port", "0", "--exit-with-parent"],
                               stdin=subprocess.PIPE, stdout=subprocess.PIPE, text=True)
          handshake = json.loads(p.stdout.readline())
          assert handshake["saidso-server"], handshake
          print("engine started:", handshake["saidso-server"], "on port", handshake["port"])
          p.stdin.close()
          sys.exit(p.wait(timeout=30))
          PY

      - name: Build the installer
        working-directory: desktop
        run: |
          npm install --no-audit --no-fund
          npx electron-forge make

      # Checksums are what a person can check by hand, without any tooling
      # and without trusting GitHub's API. Names are relative so the file reads
      # the same as the directory people download into.
      - name: Checksum the installers
        shell: bash
        working-directory: desktop/out/make
        run: |
          find . -type f ! -name 'SHA256SUMS*' -print0             | sort -z             | xargs -0 sha256sum > "SHA256SUMS-${{ matrix.os }}.txt"
          cat "SHA256SUMS-${{ matrix.os }}.txt"

      # Provenance for the installers themselves, not the checksum file: the
      # attestation is what makes the checksums worth trusting.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            desktop/out/make/**/*.exe
            desktop/out/make/**/*.zip
            desktop/out/make/**/*.nupkg
            desktop/out/make/**/*.dmg
            desktop/out/make/**/*.deb
            desktop/out/make/**/*.rpm

      - uses: actions/upload-artifact@v4
        with:
          name: saidso-${{ matrix.os }}
          path: desktop/out/make/**/*

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/out/make/**/*
          draft: true
