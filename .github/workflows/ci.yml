name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # The core install is tested deliberately: parsing, routing, trackers,
      # config and sync must all work without a model runtime or an audio
      # backend, on every platform.
      - run: pip install -e ".[docx,dev]"
      - run: pytest -q
      - run: ruff check .
        if: matrix.python == '3.12' && matrix.os == 'ubuntu-latest'

  build:
    name: build the wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - run: pip install dist/*.whl && saidso --version
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  desktop:
    name: desktop shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-audit --no-fund
        working-directory: desktop
      - run: npm run check
        working-directory: desktop
